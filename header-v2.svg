<svg width="1000" height="250" viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="250" rx="18" fill="url(#bg)"/>

  <circle cx="90" cy="40" r="110" fill="#ffffff" opacity="0.07"/>
  <circle cx="930" cy="230" r="140" fill="#ffffff" opacity="0.07"/>

  <text x="500" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Jawad Ul Hassan</text>
  <text x="500" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e0e7ff">Software Engineer · AI &amp; Backend</text>

  <!-- Pills (base) -->
  <g fill="#ffffff" fill-opacity="0.18">
    <rect x="110" y="160" width="150" height="44" rx="22"/>
    <rect x="320" y="160" width="150" height="44" rx="22"/>
    <rect x="530" y="160" width="150" height="44" rx="22"/>
    <rect x="740" y="160" width="150" height="44" rx="22"/>
  </g>

  <!-- Base labels -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="185" y="189">Build</text>
    <text x="395" y="189">Struggle</text>
    <text x="605" y="189">Rest</text>
    <text x="815" y="189">Repeat</text>
  </g>

  <!-- Arrows -->
  <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M272 182 H308 M298 174 L308 182 L298 190"/>
    <path d="M482 182 H518 M508 174 L518 182 L508 190"/>
    <path d="M692 182 H728 M718 174 L728 182 L718 190"/>
  </g>

  <!-- Highlight: Build -->
  <g opacity="1">
    <rect x="110" y="160" width="150" height="44" rx="22" fill="#ffffff"/>
    <text x="185" y="189" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#5b21b6">Build</text>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.22;0.27;0.97;1" values="1;1;0;0;1"/>
  </g>

  <!-- Highlight: Struggle -->
  <g opacity="0">
    <rect x="320" y="160" width="150" height="44" rx="22" fill="#ffffff"/>
    <text x="395" y="189" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#5b21b6">Struggle</text>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.22;0.27;0.47;0.52;1" values="0;0;1;1;0;0"/>
  </g>

  <!-- Highlight: Rest -->
  <g opacity="0">
    <rect x="530" y="160" width="150" height="44" rx="22" fill="#ffffff"/>
    <text x="605" y="189" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#5b21b6">Rest</text>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.47;0.52;0.72;0.77;1" values="0;0;1;1;0;0"/>
  </g>

  <!-- Highlight: Repeat -->
  <g opacity="0">
    <rect x="740" y="160" width="150" height="44" rx="22" fill="#ffffff"/>
    <text x="815" y="189" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#5b21b6">Repeat</text>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.72;0.77;0.97;1" values="0;0;1;1;0"/>
  </g>
</svg>
