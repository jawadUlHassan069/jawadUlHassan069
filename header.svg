<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" rx="16" fill="url(#bg)"/>

  <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Jawad Ul Hassan</text>
  <text x="500" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#9ecbff">Software Engineer · AI &amp; Backend</text>

  <line x1="380" y1="170" x2="620" y2="170" stroke="#9ecbff" stroke-opacity="0.4" stroke-width="1"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="330" y="212" opacity="1">Build
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="1;0.3;0.3;0.3;1"/>
    </text>
    <text x="450" y="212" opacity="0.3">Struggle
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="0.3;1;0.3;0.3;0.3"/>
    </text>
    <text x="560" y="212" opacity="0.3">Rest
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="0.3;0.3;1;0.3;0.3"/>
    </text>
    <text x="665" y="212" opacity="0.3">Repeat
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="0.3;0.3;0.3;1;0.3"/>
    </text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#9ecbff" text-anchor="middle" opacity="0.6">
    <text x="392" y="212">→</text>
    <text x="508" y="212">→</text>
    <text x="610" y="212">→</text>
  </g>
</svg>
